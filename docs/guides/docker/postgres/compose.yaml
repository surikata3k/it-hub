# PostgreSQL 18 con datos y configuración persistentes.
# Dónde se guarda cada cosa se elige en el fichero .env:
#   PG_DATA / PG_CONF = nombre  -> volumen de Docker
#   PG_DATA / PG_CONF = ./ruta  -> carpeta de Windows (junto a este fichero)

name: postgres

services:
  postgres:
    image: postgres:${PG_VERSION:-18}
    container_name: ${PG_CONTAINER:-pg18}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      # Datos (en PostgreSQL 18+ se monta /var/lib/postgresql, no .../data)
      - ${PG_DATA:-pgdata}:/var/lib/postgresql
      # Configuración: postgresql.conf y pg_hba.conf
      - ${PG_CONF:-pgconf}:/etc/postgresql/custom

    # Antes de arrancar PostgreSQL, si la carpeta/volumen de configuración
    # está vacía, se crean postgresql.conf y pg_hba.conf por defecto.
    # Si ya existen, NO se tocan: se usan tal cual los hayas editado.
    entrypoint:
      - bash
      - -c
      - |
        set -e
        CONF=/etc/postgresql/custom
        mkdir -p "$$CONF"

        if [ ! -f "$$CONF/postgresql.conf" ]; then
          cp /usr/share/postgresql/postgresql.conf.sample "$$CONF/postgresql.conf"
          sed -ri "s!^#?(listen_addresses)\s*=\s*\S+.*!\1 = '*'!" "$$CONF/postgresql.conf"
          echo ">> Creado $$CONF/postgresql.conf"
        fi

        if [ ! -f "$$CONF/pg_hba.conf" ]; then
          cat > "$$CONF/pg_hba.conf" <<'EOF'
        # TYPE  DATABASE        USER            ADDRESS                 METHOD
        local   all             all                                     trust
        host    all             all             127.0.0.1/32            scram-sha-256
        host    all             all             ::1/128                 scram-sha-256
        host    all             all             0.0.0.0/0               scram-sha-256
        host    all             all             ::/0                    scram-sha-256
        local   replication     all                                     trust
        host    replication     all             0.0.0.0/0               scram-sha-256
        EOF
          echo ">> Creado $$CONF/pg_hba.conf"
        fi

        exec docker-entrypoint.sh "$$@"
      - bash
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/custom/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/custom/pg_hba.conf

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

# Volúmenes con nombre fijo: no dependen del nombre de la carpeta del proyecto.
# Si usas carpetas de Windows, se declaran igualmente pero quedan sin usar.
volumes:
  pgdata:
    name: pgdata
  pgconf:
    name: pgconf
